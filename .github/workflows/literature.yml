# 獣医学文献の定期収集（毎週月曜 3:10 JST）。公開リポジトリのGitHub Actionsは無料。
name: literature-collect
on:
  schedule:
    - cron: '10 18 * * 0'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline self-test
        run: |
          python3 tools/literature/collect.py --fixture tests/fixtures/europepmc_sample.json --out /tmp/fx
          python3 tools/ai/evaluate.py eval/cases.sample.jsonl tests/fixtures/answers_good.jsonl
      - name: Collect papers from Europe PMC
        run: python3 tools/literature/collect.py --since 2019 --max-per-query 200
      - name: Build knowledge base
        run: python3 tools/literature/kb.py build
      - name: Commit
        run: |
          git config user.name "pawcare-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/literature
          git diff --cached --quiet || git commit -m "文献データを更新（自動収集）"
          git push
