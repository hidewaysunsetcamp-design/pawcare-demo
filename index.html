<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ことぽすと｜うちの子の“いつも”を、先生へ。</title>

  <meta name="theme-color" content="#E2520B">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ことぽすと">
  <meta property="og:title" content="ことぽすと｜うちの子の“いつも”を、先生へ。">
  <meta property="og:description" content="ごはん・お散歩・体調の変化を記録して、もしもの時は動物病院に伝えるメモをすぐ作成。">
  <meta property="og:url" content="https://kotopost.jp/">
  <meta property="og:image" content="https://kotopost.jp/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ことぽすと">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preload" href="img/splash-bg.webp" as="image">
  <link rel="preload" href="img/splash-chick.webp" as="image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <noscript>
    <p class="noscript">ことぽすとを利用するにはJavaScriptを有効にしてください。</p>
  </noscript>

  <div id="splash" class="splash" role="img" aria-label="ことぽすと 読み込み中">
    <div class="splash-stage">
      <img class="splash-bg" src="img/splash-bg.webp" alt="" width="864" height="1152">
      <img class="splash-chick" src="img/splash-chick.webp" alt="" width="436" height="563">
    </div>
  </div>
  <script>
    (function () {
      var s = document.getElementById('splash');
      function drop() { if (s && s.parentNode) s.parentNode.removeChild(s); }
      try {
        var calm = /^#\/(emergency|interview|card|view)/.test(location.hash);
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (calm || reduce || sessionStorage.getItem('kp.splash')) { drop(); return; }
        sessionStorage.setItem('kp.splash', '1');
      } catch (e) {}
      s.addEventListener('click', drop);
      setTimeout(drop, 2300);
    })();
  </script>

  <header class="app-header">
    <div class="brand">
      <img src="icons/icon-192.png" alt="ことぽすと" width="30" height="30">
    </div>
    <button type="button" class="header-emergency" data-nav="emergency" aria-label="緊急時の案内を開く">緊急時</button>
  </header>

  <div id="storageBanner" class="storage-banner" hidden></div>

  <main id="app" class="app-main" aria-live="polite">
    <p class="loading">読み込み中…</p>
  </main>

  <nav class="bottom-nav" aria-label="メインメニュー">
    <button type="button" data-nav="home"><span class="ico" aria-hidden="true">🏠</span><span>ホーム</span></button>
    <button type="button" data-nav="logs"><span class="ico" aria-hidden="true">📝</span><span>記録</span></button>
    <button type="button" data-nav="interview"><span class="ico" aria-hidden="true">🩺</span><span>問診</span></button>
    <button type="button" data-nav="pets"><span class="ico" aria-hidden="true">🐾</span><span>ペット</span></button>
    <button type="button" data-nav="settings"><span class="ico" aria-hidden="true">⚙️</span><span>設定</span></button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close-sheet></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-grab" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 id="sheetTitle"></h2>
        <button type="button" class="icon-btn" data-close-sheet aria-label="閉じる">✕</button>
      </div>
      <div id="sheetBody" class="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/vendor/qrcode.js"></script>
  <script src="js/data.js"></script>
  <script src="js/care.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
